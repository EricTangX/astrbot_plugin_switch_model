name: astrbot_plugin_switch_model
display_name: 自动切换模型
desc: "模型调用报错（额度耗尽、限流、鉴权失效、模型下线等）时，按你配置的顺序自动切换到下一个可用模型。文本、图像、音频三类模型可分别配置一份有序列表：消息带图片走图像列表，带语音走音频列表，纯文本走文本列表，报错时在同一份列表里往后换。插件配置表单里直接下拉勾选模型，选中项用 ↑↓ 调整先后，顺序即优先级；另有按模态分组、标注模型能力与冷却状态的可视化配置页。支持失败冷却、候选上限、主模型持久化与管理指令，适用于多模型 fallback、多模态分流、成本分级等场景。"
short_desc: "模型报错自动切换；文本/图像/音频三类各设优先级，配置表单内下拉选模型、上下移动调顺序"
version: 1.3.0
author: EricTangX
repo: https://github.com/EricTangX/astrbot_plugin_switch_model
astrbot_version: ">=4.0.0"
# 插件不接触任何平台适配器 API，只挂钩 Provider 层；这里列的是主要使用场景
support_platforms:
  - aiocqhttp
  - qq_official
tags:
  - 模型切换
  - 故障转移
  - fallback
  - 多模型
  - 优先级
  - 多模态
  - 冷却
  - 模型管理
